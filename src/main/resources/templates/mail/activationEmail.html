<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title>Planly Account Activation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body>
    <p>Hi <span th:text="${user.login}">user</span>,</p>

    <p>Your new account has been created. Please click the link below to activate it:</p>

    <p>
      <a th:with="url=(@{|${baseUrl}/account/activate?key=${user.activationKey}|})" th:href="${url}" th:text="${url}"> Activation link </a>
    </p>

    <p>
      Thanks for checking out Planly,
      <br />
      <em>Planly Team</em>
    </p>
  </body>
</html>
