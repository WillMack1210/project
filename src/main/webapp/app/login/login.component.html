<title>Login</title>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-text">Planly</span>
    </div>

    <div class="auth-header">
      <h1 data-cy="loginTitle" class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Access your personal calendar and social planner.</p>
    </div>

    @if (authenticationError()) {
      <div class="alert alert-danger auth-alert" data-cy="loginError">
        <strong>Failed to sign in!</strong> Please check your credentials and try again.
      </div>
    }

    <form class="auth-form" (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input
          type="text"
          class="form-control auth-input"
          name="username"
          id="username"
          placeholder="Your username is not case sensitive"
          formControlName="username"
          #username
          data-cy="username"
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          class="form-control auth-input"
          name="password"
          id="password"
          placeholder="Your password"
          formControlName="password"
          data-cy="password"
        />
      </div>

      <div class="auth-options mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <a class="auth-link" routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector"> Forgot password? </a>
      </div>

      <button type="submit" class="btn btn-primary auth-submit-btn" data-cy="submit">Sign in</button>
    </form>

    <div class="auth-footer">
      <span>Don&apos;t have an account?</span>
      <a class="auth-link" routerLink="/account/register">Register here</a>
    </div>
  </div>
</div>
